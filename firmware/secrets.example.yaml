# Copy this file to secrets.yaml and fill in your own values.
# NEVER commit your real secrets.yaml (it's listed in .gitignore).
wifi_ssid: "YourWiFiName"
wifi_password: "YourWiFiPassword"
fallback_ap_password: "choose-a-password"
ota_password: "choose-a-password"
# 32-byte base64 key. The ESPHome dashboard generates one for new devices,
# or generate one at https://esphome.io/components/api.html
api_encryption_key: "REPLACE_WITH_YOUR_OWN_KEY"
